---
name: Build

on:
  push:
  pull_request:

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install build dependencies
        run: brew install automake libtool nasm
      - name: Build native code
        run: |
          export CPPFLAGS="-I${JAVA_HOME}/include -I${JAVA_HOME}/include/darwin"
          export CXXFLAGS="-I${JAVA_HOME}/include -static-libstdc++"
          cd libjpeg-turbo
          autoreconf -fiv
          mkdir build
          cd build
          ../configure --with-java
          make
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: configure log
          path: libjpeg-turbo/build/config.log
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-macos-arm64
          path: libjpeg-turbo/build/.libs/libturbojpeg.dylib
          if-no-files-found: error
  build-macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install build dependencies
        run: brew install automake libtool nasm
      - name: Build native code
        run: |
          export CPPFLAGS="-I${JAVA_HOME}/include -I${JAVA_HOME}/include/darwin"
          cd libjpeg-turbo
          autoreconf -fiv
          mkdir build
          cd build
          ../configure --with-java
          make
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: configure log
          path: libjpeg-turbo/build/config.log
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-macos-x86_64
          path: libjpeg-turbo/build/.libs/libturbojpeg.dylib
          if-no-files-found: error
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build native code
        run: |
          docker build -f Dockerfile_aarch64 . -t native_builder
          docker run -v $(pwd):/build --user ${UID} -t native_builder /build/linux.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: configure log
          path: libjpeg-turbo/build/config.log
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-linux-arm64
          path: libjpeg-turbo/build/.libs/libturbojpeg.so
          if-no-files-found: error
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build native code
        run: |
          docker build -f Dockerfile_x86_64 . -t native_builder
          docker run -v $(pwd):/build --user ${UID} -t native_builder /build/linux.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: configure log
          path: libjpeg-turbo/build/config.log
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-linux-x86_64
          path: libjpeg-turbo/build/.libs/libturbojpeg.so
          if-no-files-found: error
  build-windows-x86_64:
    runs-on: windows-2022
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install NASM
        uses: ilammy/setup-nasm@v1
      - name: Apply patches
        run: |
          cd libjpeg-turbo
          git apply ..\0000-msvc-2010-compat.patch
      - name: Build native code
        run: |
          cd libjpeg-turbo
          mkdir build
          cd build
          cmake -DWITH_JAVA=ON ..
          cmake --build .
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-windows-x86_64
          path: libjpeg-turbo/build/**/turbojpeg.dll
          if-no-files-found: error
  test:
    needs: [build-macos-arm64, build-macos-x86_64, build-windows-x86_64, build-linux-arm64, build-linux-x86_64]
    strategy:
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
        java: [17, 21, 25]
    runs-on: ${{ matrix.os }}
    env:
      gradle_commands: --stacktrace clean jar
      test_commands: --stacktrace test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '${{ matrix.java }}'
      - name: Download artifacts from build
        uses: actions/download-artifact@v8
      - name: List artifacts
        run: ls -R
      - name: Move pre-built binaries under resources
        run: ./jar-pack.sh
        shell: bash
      - name: Run commands
        run: |
          ./gradlew ${{ env.gradle_commands }}
      - name: Run tests
        run: |
          ./gradlew ${{ env.test_commands }}
  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      gradle_commands: --stacktrace clean jar
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Download artifacts from build
        uses: actions/download-artifact@v8
      - name: List artifacts
        run: ls -R
      - name: Move pre-built binaries under resources
        run: ./jar-pack.sh
      - name: Run commands
        run: |
          ./gradlew ${{ env.gradle_commands }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libjpeg-turbo-java
          path: build/libs/*.jar
      - name: Release
        if: startsWith(github.ref, 'refs/tags')
        run: |
          gh release create --generate-notes "${GITHUB_REF#refs/tags/}" build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
